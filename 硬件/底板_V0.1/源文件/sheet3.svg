<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="990" viewBox="0 0 1400 990"><line x1="20" y1="20" x2="1380" y2="20" stroke="#175a78" stroke-width="1.4"/><line x1="1380" y1="20" x2="1380" y2="970" stroke="#175a78" stroke-width="1.4"/><line x1="1380" y1="970" x2="20" y2="970" stroke="#175a78" stroke-width="1.4"/><line x1="20" y1="970" x2="20" y2="20" stroke="#175a78" stroke-width="1.4"/><text x="44" y="58" fill="#202d3c" font-family="Arial,sans-serif" font-size="22">C8T6 MOTION / 4 AXIS BASEBOARD</text><text x="44" y="86" fill="#202d3c" font-family="Arial,sans-serif" font-size="18">03 / Host UART and electrical interface notes</text><text x="44" y="110" fill="#202d3c" font-family="Arial,sans-serif" font-size="11">USART1: PA9 = TX, PA10 = RX. No remapping. 3.3V TTL only, shared GND, USB-to-UART adapter required for PC.</text><line x1="40" y1="130" x2="1360" y2="130" stroke="#175a78" stroke-width="1.4"/><line x1="40" y1="920" x2="1360" y2="920" stroke="#175a78" stroke-width="1.4"/><text x="44" y="945" fill="#202d3c" font-family="Arial,sans-serif" font-size="11">V0.1 - REVIEW DRAFT | 2026-11-19 | 5V common-anode optocoupler drivers | No PCB / no ERC yet</text><text x="1250" y="945" fill="#202d3c" font-family="Arial,sans-serif" font-size="12">3 / 3</text><text x="70" y="194" fill="#a33328" font-family="Arial,sans-serif" font-size="11">UART_TX_PA9</text><line x1="70" y1="200" x2="235" y2="200" stroke="#175a78" stroke-width="1.4"/><line x1="235" y1="200" x2="251" y2="200" stroke="#175a78" stroke-width="1.4"/><line x1="251" y1="194" x2="293" y2="194" stroke="#175a78" stroke-width="1.4"/><line x1="293" y1="194" x2="293" y2="206" stroke="#175a78" stroke-width="1.4"/><line x1="293" y1="206" x2="251" y2="206" stroke="#175a78" stroke-width="1.4"/><line x1="251" y1="206" x2="251" y2="194" stroke="#175a78" stroke-width="1.4"/><line x1="293" y1="200" x2="310" y2="200" stroke="#175a78" stroke-width="1.4"/><text x="251" y="186" fill="#202d3c" font-family="Arial,sans-serif" font-size="10">R17 100R</text><line x1="310" y1="200" x2="470" y2="200" stroke="#175a78" stroke-width="1.4"/><text x="390" y="194" fill="#a33328" font-family="Arial,sans-serif" font-size="11">HOST_RX</text><text x="70" y="384" fill="#a33328" font-family="Arial,sans-serif" font-size="11">UART_RX_PA10</text><line x1="70" y1="390" x2="235" y2="390" stroke="#175a78" stroke-width="1.4"/><line x1="235" y1="390" x2="251" y2="390" stroke="#175a78" stroke-width="1.4"/><line x1="251" y1="384" x2="293" y2="384" stroke="#175a78" stroke-width="1.4"/><line x1="293" y1="384" x2="293" y2="396" stroke="#175a78" stroke-width="1.4"/><line x1="293" y1="396" x2="251" y2="396" stroke="#175a78" stroke-width="1.4"/><line x1="251" y1="396" x2="251" y2="384" stroke="#175a78" stroke-width="1.4"/><line x1="293" y1="390" x2="310" y2="390" stroke="#175a78" stroke-width="1.4"/><text x="251" y="376" fill="#202d3c" font-family="Arial,sans-serif" font-size="10">R18 100R</text><line x1="310" y1="390" x2="470" y2="390" stroke="#175a78" stroke-width="1.4"/><text x="390" y="384" fill="#a33328" font-family="Arial,sans-serif" font-size="11">HOST_TX</text><line x1="190" y1="390" x2="190" y2="320" stroke="#175a78" stroke-width="1.4"/><circle cx="190" cy="390" r="3" fill="#175a78"/><line x1="184" y1="275" x2="196" y2="275" stroke="#175a78" stroke-width="1.4"/><line x1="196" y1="275" x2="196" y2="320" stroke="#175a78" stroke-width="1.4"/><line x1="196" y1="320" x2="184" y2="320" stroke="#175a78" stroke-width="1.4"/><line x1="184" y1="320" x2="184" y2="275" stroke="#175a78" stroke-width="1.4"/><line x1="190" y1="275" x2="190" y2="250" stroke="#175a78" stroke-width="1.4"/><text x="170" y="244" fill="#a33328" font-family="Arial,sans-serif" font-size="11">+3V3_CORE</text><text x="205" y="300" fill="#202d3c" font-family="Arial,sans-serif" font-size="11">R19 10k</text><text x="650" y="172" fill="#202d3c" font-family="Arial,sans-serif" font-size="13">J6  HOST UART / 3.81 mm 3P</text><line x1="650" y1="200" x2="780" y2="200" stroke="#175a78" stroke-width="1.4"/><line x1="780" y1="200" x2="780" y2="287" stroke="#175a78" stroke-width="1.4"/><line x1="780" y1="287" x2="650" y2="287" stroke="#175a78" stroke-width="1.4"/><line x1="650" y1="287" x2="650" y2="200" stroke="#175a78" stroke-width="1.4"/><text x="660" y="226" fill="#202d3c" font-family="Arial,sans-serif" font-size="10">1</text><line x1="690" y1="222" x2="815" y2="222" stroke="#175a78" stroke-width="1.4"/><text x="820" y="216" fill="#a33328" font-family="Arial,sans-serif" font-size="11">HOST_RX</text><text x="660" y="251" fill="#202d3c" font-family="Arial,sans-serif" font-size="10">2</text><line x1="690" y1="247" x2="815" y2="247" stroke="#175a78" stroke-width="1.4"/><text x="820" y="241" fill="#a33328" font-family="Arial,sans-serif" font-size="11">HOST_TX</text><text x="660" y="276" fill="#202d3c" font-family="Arial,sans-serif" font-size="10">3</text><line x1="690" y1="272" x2="815" y2="272" stroke="#175a78" stroke-width="1.4"/><text x="820" y="266" fill="#a33328" font-family="Arial,sans-serif" font-size="11">GND</text><text x="650" y="330" fill="#202d3c" font-family="Arial,sans-serif" font-size="13">1 = card TX -&gt; adapter RX</text><text x="650" y="357" fill="#202d3c" font-family="Arial,sans-serif" font-size="13">2 = card RX &lt;- adapter TX (3.3V)</text><text x="650" y="384" fill="#202d3c" font-family="Arial,sans-serif" font-size="13">3 = card GND &lt;-&gt; adapter GND</text><text x="650" y="422" fill="#b51f27" font-family="SimHei,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="13">上位机使用 3.3V USB 转 TTL 模块。</text><text x="650" y="448" fill="#b51f27" font-family="SimHei,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="13">TX 与 RX 交叉连接，GND 相连，VCC 不接。</text><text x="850" y="535" fill="#b51f27" font-family="SimHei,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="13">先设定 DIR，再发 PUL，时序按驱动器手册。</text><text x="850" y="564" fill="#b51f27" font-family="SimHei,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="13">确认驱动器支持 5V 共阳输入，并按手册确认限流。</text><text x="70" y="480" fill="#202d3c" font-family="Arial,sans-serif" font-size="15">OUTPUT CONTRACT</text><text x="70" y="515" fill="#202d3c" font-family="Arial,sans-serif" font-size="12">1. Drivers must accept 5V common-anode PUL/DIR inputs with internal current-limiting resistors.</text><text x="70" y="544" fill="#202d3c" font-family="Arial,sans-serif" font-size="12">2. If the driver requires an external resistor, fit the value specified by its datasheet in the cable.</text><text x="70" y="573" fill="#202d3c" font-family="Arial,sans-serif" font-size="12">3. Do not connect these outputs to 12V/24V control terminals or bare LEDs without a series resistor.</text><text x="70" y="602" fill="#202d3c" font-family="Arial,sans-serif" font-size="12">4. PUL_N and DIR_N are sinking outputs, not differential line-driver outputs. Do not use as RS-422.</text><text x="70" y="631" fill="#202d3c" font-family="Arial,sans-serif" font-size="12">5. Each axis has its own timer period. Actual maximum frequency and pulse width await driver testing.</text><text x="70" y="660" fill="#202d3c" font-family="Arial,sans-serif" font-size="12">6. Initialize DIR first, then enable PUL; idle PUL GPIO low. Meet driver DIR setup/hold timing.</text><text x="70" y="689" fill="#202d3c" font-family="Arial,sans-serif" font-size="12">7. Reset gate pull-downs turn MOSFETs off. This is not an emergency-stop safety circuit.</text><text x="70" y="718" fill="#202d3c" font-family="Arial,sans-serif" font-size="12">8. UART: use short local cable. No RS-232/RS-485 transceiver, galvanic isolation or surge protection.</text><text x="70" y="747" fill="#202d3c" font-family="Arial,sans-serif" font-size="12">9. Do not wire a 5V UART adapter VCC to this connector; only TX/RX/GND are provided.</text><text x="70" y="776" fill="#202d3c" font-family="Arial,sans-serif" font-size="12">10. Coreboard socket pitch/row spacing and terminal orientation remain to be verified before PCB.</text><text x="70" y="805" fill="#202d3c" font-family="Arial,sans-serif" font-size="12">11. Limit/home, enable, emergency stop and spindle interfaces are outside this initial draft.</text><text x="70" y="834" fill="#202d3c" font-family="Arial,sans-serif" font-size="12">12. Device selection checked against ST STM32F103x8/xB datasheet and AOS AO3400A datasheet.</text></svg>